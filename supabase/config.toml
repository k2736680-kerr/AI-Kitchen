project_id = "ai-kitchen"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[auth]
site_url = "ai-kitchen://auth"
additional_redirect_urls = []
enable_signup = true
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = false
enable_confirmations = true

[functions.api]
verify_jwt = false
